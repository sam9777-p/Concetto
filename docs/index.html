<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concetto'26 — Centenary Edition | IIT (ISM) Dhanbad</title>
  <meta name="description" content="Official website and event gateway for Concetto'26 — Centauri Synapse at IIT (ISM) Dhanbad. Explore 39+ flagship tech events, passes, and official merchandise.">
  <link rel="icon" type="image/png" href="../assets/images/logo_square.png">
  <style>
    :root {
      --primary: #FF4500;
      --primary-dark: #CC3700;
      --bg: #0A0201;
      --surface: #140503;
      --surface-border: #2D0E08;
      --text: #F5EAE8;
      --muted: #A8908C;
      --accent: #FF8A00;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
    }
    .container {
      max-width: 580px;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 24px;
      padding: 36px 24px;
      box-shadow: 0 20px 60px rgba(255, 69, 0, 0.15);
    }
    .logo-container {
      width: 110px;
      height: 110px;
      margin: 0 auto 20px;
      background: radial-gradient(circle, rgba(255, 69, 0, 0.25) 0%, transparent 70%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-container img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      border-radius: 18px;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(255, 69, 0, 0.15);
      border: 1px solid rgba(255, 69, 0, 0.35);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #FFF 30%, #FF8A00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    p.subtitle {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      color: #000;
    }
    .btn-primary:hover {
      opacity: 0.92;
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--surface-border);
      color: var(--text);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .footer {
      margin-top: 24px;
      font-size: 11px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">IIT (ISM) DHANBAD • CENTENARY EDITION</div>
    <div class="logo-container">
      <img src="https://raw.githubusercontent.com/sam9777-p/Concetto/master/assets/images/logo_square.png" alt="Concetto Logo">
    </div>
    <h1>CONCETTO '26</h1>
    <p class="subtitle">Centauri Synapse — Forged Over a Century, Soaring Towards Infinity.<br>Eastern India's Largest Techno-Management Fest.</p>
    
    <div class="actions">
      <a href="concetto://events" class="btn btn-primary">
        <span>⚡ OPEN CONCETTO APP</span>
      </a>
      <a href="events/index.html" class="btn btn-secondary">
        <span>🌐 EXPLORE EVENTS DIRECTORY</span>
      </a>
      <a href="https://docs.google.com/forms/d/1YH3YaouuGGCdojzgFMKLKArhAHH8GGsszZ7CQg2HzN0/viewform" target="_blank" class="btn btn-secondary">
        <span>👕 ORDER OFFICIAL T-SHIRT</span>
      </a>
    </div>

    <div class="footer">
      October 08 – 11, 2026 • IIT (ISM) Dhanbad, Jharkhand
    </div>
  </div>
</body>
</html>
