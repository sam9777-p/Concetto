name: concetto
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  dio: ^5.11.0
  google_fonts: ^8.2.1
  flutter_svg: ^2.3.0
  cached_network_image: ^4.0.2
  shared_preferences: ^2.5.5
  intl: ^0.20.3

  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  flutter_animate: ^4.5.2
  image_picker: ^1.1.2
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  syncfusion_flutter_pdfviewer: ^34.2.9
  qr_flutter: ^4.1.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
